name: Daily rebuild (Cloudflare Pages deploy hook)
on:
  schedule:
    - cron: '0 0 * * *'   # every day 00:00 UTC = 08:00 Beijing time
  workflow_dispatch: {}    # manual "Run workflow" button
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then echo "DEPLOY_HOOK_URL secret not set"; exit 1; fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" > /dev/null && echo "Rebuild triggered"
